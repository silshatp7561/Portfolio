<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="Utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="index.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="sa">
            <form>
                <div class="digitally">
                    Digital
                </div>
                <div class="art">
                    Artificial Intelligence Driving<br>
                    Results For The Travel Industry
                </div>
                <div class="welcome">
                    Welcome back! Please login to your account.
                </div>
                <div class="input-container">
                    <span>Email section</span>
                    <br>
                    <input type="email" placeholder="Email Address">
                    <br>
                    <input type="password" placeholder="Password" style="margin-top: 10px;">
                </div>
                <div class="forgot">
                    <span>forgot password?</span>
                </div>
                <div class="btn">
                    <button class="login">log in</button>
                    <button class="signup">sign up</button>
                </div>
                <div class="last">

                    or login with <strong class="app"> Facebook Linkedin Google</strong>
                </div>

            </form>

        </div>
        <div class="sb">
            <div class>
                <form>
                    <div class="homediv">
                        <span class="hometext">Home AboutUs Blog Pricing</span>
                    </div>
                </form>

                <div class="cover-div">
                    <img src="image.png" class="cover">
                </div>
            </div>
        </div>
</body>
